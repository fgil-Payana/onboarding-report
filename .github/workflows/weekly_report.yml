name: Weekly Onboarding Report

on:
  schedule:
    # Lunes 9:00am Colombia (UTC-5) = Lunes 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:   # permite correrlo manualmente desde GitHub UI

permissions:
  contents: write      # necesario para hacer push a gh-pages

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repo (rama main)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Correr el script (sin dependencias externas — solo stdlib)
      - name: Update report
        env:
          POSTHOG_API_KEY:  ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT:  ${{ secrets.POSTHOG_PROJECT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python update_report.py

      # 4. Publicar el index.html resultante en GitHub Pages (rama gh-pages)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./          # publica index.html desde la raíz
          publish_branch: gh-pages
          # Solo publica index.html, no el resto del repo
          include_files: index.html
