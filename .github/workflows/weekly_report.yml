name: Weekly Onboarding Report

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report
        env:
          POSTHOG_API_KEY:   ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT:   ${{ secrets.POSTHOG_PROJECT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python update_report.py

      - name: Publish to gh-pages
        run: |
          # 1. Primero mover el archivo a /tmp (fuera del repo)
          mv _deploy/index.html /tmp/report.html
          echo "✓ Archivo guardado en /tmp"

          # 2. Configurar git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 3. Ahora sí puede hacer checkout sin conflictos
          git fetch origin gh-pages
          git checkout gh-pages
          echo "✓ En rama gh-pages"

          # 4. Copiar el reporte
          cp /tmp/report.html index.html
          echo "✓ index.html copiado"

          # 5. Commit y push
          git add index.html
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "Reporte $(date +'%Y-%m-%d')"
          git push origin gh-pages
          echo "✓ Push completado"
