name: Weekly Onboarding Report

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report
        env:
          POSTHOG_API_KEY:   ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT:   ${{ secrets.POSTHOG_PROJECT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python update_report.py

      - name: Verify output
        run: |
          python3 -c "
          lines = open('_deploy/index.html', encoding='utf-8').readlines()
          long = [(i+1, len(l)) for i,l in enumerate(lines) if len(l) > 1000]
          print(f'Total lines: {len(lines)}')
          print(f'Lines > 1000 chars: {len(long)}')
          for ln, llen in long[:10]:
              print(f'  Line {ln}: {llen} chars')
          if long:
              exit(1)
          else:
              print('OK - no long lines')
          "

      - name: Publish to gh-pages
        run: |
          # Guardar el reporte generado en /tmp
          cp _deploy/index.html /tmp/report.html
          echo "✓ index.html guardado en /tmp"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git fetch origin gh-pages
          git checkout gh-pages
          echo "✓ En rama gh-pages"

          # Eliminar _deploy/ si existe (limpieza de runs anteriores)
          if [ -d "_deploy" ]; then
            git rm -rf _deploy/
            echo "✓ _deploy/ eliminado"
          fi

          # Copiar el reporte a la raíz
          cp /tmp/report.html index.html
          echo "✓ index.html copiado a raíz"

          git add -A
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "Reporte $(date +'%Y-%m-%d')"
          git push origin gh-pages
          echo "✓ Push completado"

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATS=$(cat /tmp/report_stats.json)
          P_TOTAL=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p_total'])")
          P_BLOCKED=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p_blocked'])")
          U_TOTAL=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['u_total'])")
          U_SIN_USO=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['u_sin_uso'])")
          M1_TOTAL=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['m1_total'])")
          M1_VENC=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['m1_venc'])")
          F4_TOTAL=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['f4_total'])")
          F4_COMP=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['f4_completo'])")
          TODAY=$(date +'%d %b %Y')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"Reporte Onboarding - $TODAY\"}},
                {\"type\": \"section\", \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Pipeline bloqueado*\n$P_TOTAL negocios, $P_BLOCKED con bloqueo\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Uso Entrenamiento*\n$U_TOTAL ws, $U_SIN_USO sin uso 7d\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Proyeccion M1*\n$M1_TOTAL pipeline, $M1_VENC vencidos\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Facturas*\n$F4_TOTAL clientes, $F4_COMP con 4 facturas\"}
                ]},
                {\"type\": \"actions\", \"elements\": [{
                  \"type\": \"button\",
                  \"text\": {\"type\": \"plain_text\", \"text\": \"Ver reporte completo\"},
                  \"url\": \"https://fgil-payana.github.io/onboarding-report/\",
                  \"style\": \"primary\"
                }]}
              ]
            }"
          echo "✓ Slack enviado"
